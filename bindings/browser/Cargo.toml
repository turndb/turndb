[package]
name = "turndb-browser"
version = "0.1.4"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
base64 = "0.22"
js-sys = "0.3"
serde_json = "1"
turndb = { path = "../..", default-features = false, features = ["columnar"] }
wasm-bindgen = "0.2"
