[package]
name = "turndb-python"
version = "0.1.8"
edition = "2021"
publish = false
description = "Python binding for TurnDB's contract-v1 embedded trace store"
license = "Apache-2.0"
repository = "https://github.com/turndb/turndb"

[features]
gil-refs = []

[lib]
name = "_native"
crate-type = ["cdylib"]

[build-dependencies]
# The extension-module link arguments for macOS; see build.rs. Same line as `pyo3` below.
pyo3-build-config = "0.22"

[dependencies]
anyhow = "1"
base64 = "0.22"
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1"
turndb = { path = "../..", version = "0.1.8", default-features = false }
