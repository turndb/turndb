# No "Question or idea → Discussions" contact link here. CommandSuite has
# one; this repository does not, because Discussions is not enabled — and
# a contact link to a disabled feature is a dead end presented as a
# channel.
#
# That is a repository setting and it can change without anyone opening
# this file. Confirm before adding the link, rather than trusting this
# comment:
#
#   gh api repos/turndb/turndb --jq '{discussions: .has_discussions}'
#
# Likewise no commercial/hosted link: TurnDB has no hosted offering.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/turndb/turndb/security/policy
    about: Do NOT open a public issue for security problems. See SECURITY.md for how to report privately.
