# Every gate this repository enforces, in a place that runs without being asked.
#
# Before this existed, each check fired only at an ACTION — publish, `cargo doc`, `cargo test` — so
# it was enforced for whoever ran the command and for nobody else. That is not hypothetical: a
# clippy lint sat in `tests/dst.rs` because the person who ran clippy omitted `--all-features` and
# the flags that would have caught it lived in a shell history rather than in a file. Two people ran
# "clippy" and got different answers. The flags belong here.
#
# WHAT RUNS WHERE, stated because a workflow that quietly drops its expensive checks produces a
# green tick that means less than it looks like:
#
#   every push and PR   fmt, clippy, rustdoc, `cargo test` x3 profiles, the example classifier,
#                       the portable npm package built from committed Rust, and the native N-API
#                       addon across every Node major its package claims
#   nightly + on demand the DST harness, which reconstructs crash states and is the one suite too
#                       slow to sit in front of every push. It lives in `nightly.yml`, NOT here —
#                       see that file for why a scheduled run must not share a workflow with a
#                       push run.
#
# Every job below runs on every push and PR. NOTHING in this file is conditional on the event, so a
# `skipped` check here is an anomaly rather than routine, and the `gate` job at the bottom fails on
# one. That is deliberate: skipped and passed were previously indistinguishable to whoever acted on
# the result.
#
# The corruption suite is NOT scheduled: it is an ordinary `tests/corruption.rs` and already runs
# inside the default `cargo test`. It was a candidate for deferral until someone checked.
name: CI

on:
  push:
    # `main` for the post-merge record, `ci-alert-drill` because main-health.yml's
    # workflow_run trigger watches CI on exactly those two branches. Feature branches are
    # covered by `pull_request:` below; listing '**' here ran CI twice on every PR commit.
    branches: [main, ci-alert-drill]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an older run on the same ref. A superseded run is spend with no reader.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A private-repo runner is 2 cores and 7 GB, and this crate's test binaries each statically link
  # datafusion. The first CI run died in `ld` with SIGBUS after ten minutes — linking a dozen of
  # them in parallel exhausts the runner. Debug info is the bulk of what gets linked and nothing
  # here reads a backtrace, so dropping it is the cheap half; capping build parallelism is the rest.
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  rust:
    name: rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the toolchain the complete local matrix passes on. Whether current stable's lld
      # crash was real or another face of the free-tier resource exhaustion was never separated;
      # trial @stable here as its own change once this configuration is green.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # v3 starts clean on the larger runner: the free-tier keys hold artifacts written by
          # runs that died on full disks, and a truncated cached rlib reproduces exactly like a
          # deterministic linker bug.
          key: rust-gates-v3

      - name: fmt
        run: cargo fmt --check

      - name: validate release metadata and change files
        run: |
          python3 scripts/check-release-metadata.py
          python3 scripts/test-release-metadata.py
          python3 scripts/test-release-notes.py

      # --all-targets --all-features EXACTLY. Narrower flags miss the test bodies behind a feature,
      # which is how a lint survived in this tree.
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # `#![deny(rustdoc::broken_intra_doc_links)]` in both crate roots makes this fail the build
      # rather than wait for someone to sweep.
      - name: rustdoc
        run: cargo doc --no-deps

      # Includes tests/package.rs, which fails if any example is neither excluded from the package
      # nor declared user-facing, and tests/corruption.rs.
      - name: test (default)
        run: cargo test

      # The SQL plane is optional and an embedder can turn it off, so it is built and tested off.
      - name: test (no default features)
        run: cargo test --no-default-features

      # The release-profile suite runs hosted only once the repository is public. On the private
      # free tier this job's runner is 2 cores and 8 GB, and linking the DataFusion-static release
      # test binaries exceeds that machine class outright — the commit trail from f78eddd through
      # 2c9f723 documents SIGBUS and disk exhaustion under every workaround combination (disk
      # reclaim, swapfile surgery, serial links, BFD, a toolchain pin, a clean cache). The same
      # `ubuntu-latest` label serves a 4-vCPU/16 GB machine, free and unlimited, on public
      # repositories, so this step arms itself the day the repo opens. Until then the release
      # suite's evidence is local, named as such in docs/support-and-compatibility.md — a loud
      # skip rather than a quiet green. --tests drops the six example binaries that carry full
      # DataFusion links while containing no tests; they and the doctests remain compile- and
      # run-covered by clippy --all-targets --all-features and the debug suite above.
      - name: test (release)
        if: ${{ !github.event.repository.private }}
        run: cargo test --release --tests
      - name: release suite deferred on the private free tier
        if: ${{ github.event.repository.private }}
        run: |
          echo "::warning title=release-profile suite not run::exceeds the private free-tier runner class; verified locally on this source per docs/support-and-compatibility.md; arms automatically when the repository is public"

  npm:
    # `package.json` declares `engines: { node: ">=22 <27" }`, so the matrix IS the claim. The first CI
    # run pinned 22 and the suite died with SIGSEGV after its assertions passed — on a version the
    # package says it supports, while passing locally on 24. Testing one version would have made
    # that a property of whichever version someone picked.
    name: npm package (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # build.sh rebuilds turndb.wasm from the committed Rust and then runs the package suite, so
      # the tests cannot pass against an artifact nobody built. The .wasm is gitignored and
      # generated; on a fresh checkout there is nothing stale to inherit.
      - name: build wasm from source and run the package suite
        run: bash npm/build.sh

      # The CLI package's launcher resolves a platform package at runtime, which only an install
      # exercises. Run it once — the resolution is independent of Node major, and the job already
      # has the toolchain to build the binary.
      - name: cli package installs and runs
        if: matrix.node == '24'
        run: |
          node cli/scripts/pack-cli.cjs
          node cli/scripts/test-cli.cjs

      # Format/codec interoperability is independent of Node major. Run it once: WASI writes and
      # native reads, then native writes and WASI reads, each against an independent expected corpus.
      - name: cross-runtime store compatibility
        if: matrix.node == '24'
        run: bash npm/interop.sh

  native-node:
    # This matrix is the native package's `engines.node` claim. N-API 6 is meant to decouple the
    # addon from a single Node/V8 release; only loading and exercising the same Rust surface across
    # the declared majors proves that seam. Platform prebuild coverage is a separate shipping gate.
    name: native addon (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-node
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # test:dev builds the default native profile (including Arrow/DataFusion), loads Cargo's
      # shared library through process.dlopen, and runs the N-API contract suite against it.
      - name: build and test native addon
        run: npm run test:dev --prefix bindings/node

  native-prebuild:
    # Build one Node-API artifact, package it as the declared optional platform dependency, and
    # exercise a clean tarball install. `--use-napi-cross` pins the GNU symbol floor; package:pack
    # independently inspects the resulting ELF and refuses anything newer than GLIBC_2.17.
    name: native prebuild (linux x64 glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-prebuild-linux-x64-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - name: install locked packaging tools
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix bindings/node

      - name: type-check the public package surface
        run: npm run test:types --prefix bindings/node

      - name: install pinned license-report generator
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: verify native third-party licenses
        run: bash scripts/check-third-party-licenses.sh

      - name: create platform package
        run: npm run package:create --prefix bindings/node

      - name: build linux x64 glibc prebuild
        run: npm run prebuild:linux-x64-gnu:cross --prefix bindings/node

      - name: collect prebuild
        run: npm run package:collect --prefix bindings/node

      - name: pack and audit prebuild
        env:
          TURNDB_MAX_GLIBC: '2.17'
        run: npm run package:pack --prefix bindings/node

      - name: test packed install on build host
        run: npm run test:prebuild --prefix bindings/node

      - uses: actions/upload-artifact@v7
        with:
          name: turndb-native-linux-x64-gnu
          path: bindings/node/dist/
          if-no-files-found: error
          retention-days: 7

  native-prebuild-install:
    # The artifact is built once above. Loading that exact tarball on every declared Node major is
    # the N-API compatibility proof; rebuilding separately on each major would test different bits.
    name: native prebuild install (node ${{ matrix.node }})
    needs: native-prebuild
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: turndb-native-linux-x64-gnu
          path: bindings/node/dist/

      - name: install and exercise the same packed addon
        run: node bindings/node/scripts/test-prebuild.cjs bindings/node/dist

  # One check that says what actually ran, because a reader of a check list cannot tell a job that
  # passed from a job that never executed. GitHub renders `skipped` in the same muted grey as
  # `neutral`, and a matrix job that skips is not even expanded — a scheduled run used to emit the
  # literal `npm package (node ${{ matrix.node }})` — so the absence of a check is spelled
  # differently from the presence of a failing one and neither shouts.
  #
  # This job runs on every event, `needs` everything, and fails unless every dependency SUCCEEDED.
  # `skipped` and `cancelled` are failures here on purpose: nothing in this file is conditional, so
  # a skip means a dependency died or someone added a condition without adding it to this list.
  gate:
    name: gate
    if: always()
    needs: [rust, npm, native-node, native-prebuild, native-prebuild-install]
    runs-on: ubuntu-latest
    steps:
      - name: state what ran
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          width = max(len(n) for n in needs)
          bad = []
          for name in sorted(needs):
              result = needs[name]['result']
              print('  ' + name.ljust(width) + '  ' + result)
              if result != 'success':
                  bad.append((name, result))
          if bad:
              print('')
              for name, result in bad:
                  print('NOT PASSED: ' + name + ' -> ' + result)
              sys.exit(1)
          print('')
          print('every gate in this workflow ran and passed')
          PY
