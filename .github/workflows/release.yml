name: Release

on:
  pull_request:
    types: [closed]
  # A failed candidate check must be repaired on main before it is retried: rerunning the original
  # run executes the old workflow again. This dispatch deliberately reaches exactly one selected
  # publication, and accepts only an existing annotated tag with an existing GitHub release. It
  # stays in this caller because registry trusted publishers authenticate release.yml's workflow_ref.
  # PyPI publication also runs directly in this file: its current OIDC exchange identifies the
  # called workflow, while its attestation identifies this caller, so a reusable publish job cannot
  # satisfy both checks.
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing annotated release tag whose failed publication should retry
        required: true
        type: string
      component:
        description: Retry component (python = wheels + PyPI) or all; published registry versions are refused
        required: true
        type: choice
        options:
          - crate
          - native
          - wasm
          - python
          - browser
          - cli
          - all

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.head_ref == 'release' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_ref: ${{ steps.version.outputs.release_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.event.pull_request.merge_commit_sha }}
      - name: verify lockstep release metadata
        run: python3 scripts/check-release-metadata.py
      # The extraction is captured and tested rather than inlined into echo: a jq failure inside a
      # command substitution leaves echo's exit code green, and the empty ref then fails the NEXT
      # step — which is exactly how the first live run of this workflow died.
      - id: version
        name: read declared release version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "turndb") | .version')"
          test -n "$version"
          echo "release_ref=v${version}" >> "$GITHUB_OUTPUT"
      - name: verify the existing release retry target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.version.outputs.release_ref }}
          REQUESTED_REF: ${{ inputs.release_ref }}
        run: |
          test "$RELEASE_REF" = "$REQUESTED_REF"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_REF"
          test "$(git cat-file -t "$RELEASE_REF")" = tag
          gh release view "$RELEASE_REF" >/dev/null
      # Ahead of the tag on purpose. A release with nothing to say is a defect, and the cheapest
      # place to discover it is before an immutable tag exists to describe.
      - name: extract the release notes
        if: github.event_name == 'pull_request'
        env:
          RELEASE_REF: ${{ steps.version.outputs.release_ref }}
        run: python3 scripts/release-notes.py "${RELEASE_REF#v}" > "$RUNNER_TEMP/notes.md"
      - name: configure annotated tagger
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'turndb-release'
          git config user.email 'turndb-release@users.noreply.github.com'
      - name: ensure the annotated tag exists at this exact merge
        if: github.event_name == 'pull_request'
        env:
          RELEASE_REF: ${{ steps.version.outputs.release_ref }}
        run: bash scripts/ensure-release-tag.sh "$RELEASE_REF"
      - id: github_release
        name: detect an already-created GitHub release
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.version.outputs.release_ref }}
        run: |
          if gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      # This was `knope release`, which decides whether there is anything to release by comparing
      # the prepared version against the newest git tag. The step above has just created that tag,
      # so knope read its own precondition as proof the release existed, logged `Last tag is 0.1.2`,
      # and exited zero having created nothing — v0.1.2 shipped with no GitHub release and a green
      # job. Reordering is not the fix: knope's Release step reaches for the Releases API, which
      # creates a lightweight ref when the tag is absent, and the annotated object is the thing the
      # publication workflows verify. So the release is created here against the tag that already
      # exists, from notes that must be non-empty. On a retry, an existing release is success.
      - name: create the GitHub release from the changelog entry
        if: github.event_name == 'pull_request' && steps.github_release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.version.outputs.release_ref }}
        run: |
          gh release create "$RELEASE_REF" --verify-tag \
            --title "$RELEASE_REF" --notes-file "$RUNNER_TEMP/notes.md"

  # Each publication workflow's publish job requests `id-token: write` for registry trusted
  # publishing. A caller job grants a called workflow at most its own permissions, and the
  # default grant does not include `id-token`, so the grant must be explicit here: without it
  # the whole workflow fails validation at startup, before any job's `if` is evaluated.
  crate:
    needs: tag
    if: github.event_name == 'pull_request' || inputs.component == 'crate' || inputs.component == 'all'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-crate.yml
    with:
      release_ref: ${{ needs.tag.outputs.release_ref }}
    secrets: inherit

  native:
    needs: tag
    if: github.event_name == 'pull_request' || inputs.component == 'native' || inputs.component == 'all'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-native.yml
    with:
      release_ref: ${{ needs.tag.outputs.release_ref }}
    secrets: inherit

  wasm:
    needs: tag
    if: github.event_name == 'pull_request' || inputs.component == 'wasm' || inputs.component == 'all'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-wasm.yml
    with:
      release_ref: ${{ needs.tag.outputs.release_ref }}
    secrets: inherit

  python:
    needs: tag
    if: github.event_name == 'pull_request' || inputs.component == 'python' || inputs.component == 'all'
    permissions:
      contents: read
    uses: ./.github/workflows/release-python.yml
    with:
      release_ref: ${{ needs.tag.outputs.release_ref }}
    secrets: inherit

  # Keep the privileged upload in the top-level workflow. PyPI currently authenticates a reusable
  # job with job_workflow_ref but verifies its Sigstore certificate against workflow_ref; those are
  # release-python.yml and release.yml respectively when the action lives in the called workflow.
  # Running the action here makes both identities release.yml and preserves attestations.
  python_publish:
    name: Python / publish to PyPI
    needs: [tag, python]
    if: github.event_name == 'pull_request' || inputs.component == 'python' || inputs.component == 'all'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: turndb-python-*-${{ needs.tag.outputs.release_ref }}
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  browser:
    needs: tag
    if: github.event_name == 'pull_request' || inputs.component == 'browser' || inputs.component == 'all'
    permissions:
      contents: write
    uses: ./.github/workflows/release-browser.yml
    with:
      release_ref: ${{ needs.tag.outputs.release_ref }}
    secrets: inherit

  cli:
    needs: tag
    if: github.event_name == 'pull_request' || inputs.component == 'cli' || inputs.component == 'all'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-cli.yml
    with:
      release_ref: ${{ needs.tag.outputs.release_ref }}
    secrets: inherit

  # The expected skip set is coupled to workflow_dispatch.inputs.component above: change them
  # together. A component retry is green only when the requested jobs succeeded, every skip was
  # caused by that selection, and the public release is complete. Registry reads can lag writes,
  # so retry the observation; unknown state never becomes success merely because a job was skipped.
  complete:
    name: verify the public release is complete
    needs: [tag, crate, native, wasm, python_publish, browser, cli]
    if: always() && !cancelled() && needs.tag.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.release_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: verify every registry component and release asset exists
        env:
          COMPONENT: ${{ inputs.component }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.tag.outputs.release_ref }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            expected='{"tag":"success","crate":"success","native":"success","wasm":"success","python_publish":"success","browser":"success","cli":"success"}'
          elif [ "$COMPONENT" = all ]; then
            expected='{"tag":"success","crate":"success","native":"success","wasm":"success","python_publish":"success","browser":"success","cli":"success"}'
          else
            case "$COMPONENT" in
              crate)   expected='{"tag":"success","crate":"success","native":"skipped","wasm":"skipped","python_publish":"skipped","browser":"skipped","cli":"skipped"}' ;;
              native)  expected='{"tag":"success","crate":"skipped","native":"success","wasm":"skipped","python_publish":"skipped","browser":"skipped","cli":"skipped"}' ;;
              wasm)    expected='{"tag":"success","crate":"skipped","native":"skipped","wasm":"success","python_publish":"skipped","browser":"skipped","cli":"skipped"}' ;;
              python)  expected='{"tag":"success","crate":"skipped","native":"skipped","wasm":"skipped","python_publish":"success","browser":"skipped","cli":"skipped"}' ;;
              browser) expected='{"tag":"success","crate":"skipped","native":"skipped","wasm":"skipped","python_publish":"skipped","browser":"success","cli":"skipped"}' ;;
              cli)     expected='{"tag":"success","crate":"skipped","native":"skipped","wasm":"skipped","python_publish":"skipped","browser":"skipped","cli":"success"}' ;;
              *)
                echo "no complete-graph contract for event=$EVENT_NAME component=$COMPONENT" >&2
                exit 1
                ;;
            esac
          fi
          actual="$(jq -c 'with_entries(.value = .value.result)' <<<"$RESULTS")"
          if [ "$(jq -S . <<<"$actual")" != "$(jq -S . <<<"$expected")" ]; then
            echo "release job results do not match the requested component" >&2
            echo "expected: $expected" >&2
            echo "actual:   $actual" >&2
            exit 1
          fi
          version="${RELEASE_REF#v}"
          mapfile -t npm_packages < <(node <<'NODE'
          const fs = require('node:fs');
          const manifests = ['npm/turndb/package.json', 'bindings/node/package.json', 'cli/package.json'];
          const names = new Set();
          for (const path of manifests) {
            const pkg = JSON.parse(fs.readFileSync(path));
            names.add(pkg.name);
            for (const name of Object.keys(pkg.optionalDependencies || {})) names.add(name);
          }
          process.stdout.write([...names].sort().join('\n') + '\n');
          NODE
          )
          test "${#npm_packages[@]}" -gt 3
          for attempt in $(seq 1 18); do
            missing=()
            for package in "${npm_packages[@]}"; do
              # npm view reads the packument, which lagged exact-version documents by up to fifteen
              # minutes during the bootstrap. Observe the immutable version endpoint directly.
              # This proves registry existence, not packument propagation or npm installability.
              encoded="$(node -p 'encodeURIComponent(process.argv[1])' "$package")"
              curl --fail --silent --show-error \
                "https://registry.npmjs.org/$encoded/$version" >/dev/null \
                || missing+=("npm:$package@$version")
            done
            curl --fail --silent --show-error "https://crates.io/api/v1/crates/turndb/$version" \
              | jq -e --arg version "$version" '.version.num == $version' >/dev/null \
              || missing+=("crates.io:turndb@$version")
            curl --fail --silent --show-error "https://pypi.org/pypi/turndb/$version/json" >/dev/null \
              || missing+=("PyPI:turndb@$version")
            gh release view "$RELEASE_REF" --json assets \
              --jq '.assets[].name' | grep -Fx 'turndb-viewer.html' >/dev/null \
              || missing+=("GitHub:$RELEASE_REF/turndb-viewer.html")
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "release complete: $RELEASE_REF is present on npm, crates.io, PyPI, and GitHub"
              exit 0
            fi
            echo "observation $attempt/18 incomplete: ${missing[*]}"
            [ "$attempt" -eq 18 ] || sleep 10
          done
          echo "release incomplete after registry propagation window: ${missing[*]}" >&2
          exit 1
