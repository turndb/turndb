name: Build Python release candidates

on:
  workflow_call:
    inputs:
      release_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact annotated lockstep tag to build and test (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: release-python-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: manylinux wheels
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: verify tag and package version
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_REF"
          test "$(git cat-file -t "$RELEASE_REF")" = tag
          test "v$(python -c 'import tomllib; print(tomllib.load(open("bindings/python/pyproject.toml", "rb"))["project"]["version"])')" = "$RELEASE_REF"
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: >-
            --manifest-path bindings/python/Cargo.toml
            --release --out dist
            --interpreter python3.9 python3.10 python3.11 python3.12 python3.13
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: turndb-python-wheels-${{ inputs.release_ref }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'maturin>=1.7,<2'
      - run: maturin sdist --manifest-path bindings/python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: turndb-python-sdist-${{ inputs.release_ref }}
          path: dist/*.tar.gz
          if-no-files-found: error

  install:
    name: install wheel (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: turndb-python-wheels-${{ inputs.release_ref }}
          path: dist
      - name: install and exercise exact wheel
        run: |
          python -m pip install 'opentelemetry-sdk>=1.20,<2'
          python -m pip install --no-index --find-links dist turndb
          python - <<'PY'
          import tempfile
          from opentelemetry.sdk.trace import TracerProvider
          import turndb
          with tempfile.TemporaryDirectory() as root:
              store = turndb.Store.open(root + "/smoke.turndb")
              store.write([{"kind": "put", "id": "smoke", "attrs": [], "contents": []}], durable=True)
              assert [row["id"] for row in store.scan({"contractVersion": 1, "limit": 10})["rows"]] == ["smoke"]
              store.close(durable=True)
          tracer = TracerProvider().get_tracer("turndb-wheel")
          assert turndb.trace_gen_ai_call(tracer, lambda: 7, operation_name="chat") == 7
          PY
