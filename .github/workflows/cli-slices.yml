name: CLI platform slices

# This is the pre-publication proof for the CLI packages. It has no npm environment, OIDC
# permission, or publish step. Expensive macOS runners are used only when packaging inputs change.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cli-slices.yml'
      - '.github/workflows/release-cli.yml'
      - 'cli/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_LICENSES.html'
  pull_request:
    paths:
      - '.github/workflows/cli-slices.yml'
      - '.github/workflows/release-cli.yml'
      - 'cli/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
      - 'NOTICE'
      - 'THIRD_PARTY_LICENSES.html'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and pack ${{ matrix.slice }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            execute: '1'
          - slice: linux-arm64-gnu
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - slice: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            execute: '1'
          - slice: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-15
            execute: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.slice }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install the cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: build and pack this slice
        env:
          TURNDB_CLI_TARGET: ${{ matrix.target }}
          TURNDB_CLI_SLICE: ${{ matrix.slice }}
          TURNDB_CLI_PACK_SELECTOR: '1'
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: node cli/scripts/pack-cli.cjs
      - name: install and drive the native package
        if: matrix.execute == '1'
        run: node cli/scripts/test-cli.cjs cli/dist
      - uses: actions/upload-artifact@v7
        with:
          name: turndb-cli-${{ matrix.slice }}
          path: cli/dist/
          if-no-files-found: error
          retention-days: 7
