# Dependabot config — https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# THREE ecosystems, not two. TurnDB is a Rust workspace that also ships a
# native Node addon, so it carries cargo and npm manifests plus workflow
# actions. A config covering only one reads as covered.
#
#   cargo           — root workspace Cargo.toml/Cargo.lock, which resolves
#                     for the engine and both binding crates
#   npm             — bindings/node ONLY. The other two package.json files
#                     (npm/turndb, bindings/node/npm/linux-x64-gnu) declare
#                     no dependencies of any kind, so there is nothing there
#                     to update. Add them if that changes.
#   github-actions  — .github/workflows/
#
# Grouping matches CommandSuite: minor + patch batch into one PR per
# ecosystem per week; majors open their own PR because a breaking change
# deserves review on its own.
#
# The `dependencies` and `ci` labels below were CREATED on this repository
# rather than assumed. Dependabot does not create a label it cannot find --
# it drops it silently, so a config naming an absent label routes nothing
# and reports nothing. Check with:
#
#   gh api repos/turndb/turndb/labels --jq '[.[].name]'
#
# and add the label rather than removing it from here if it goes missing.

version: 2
updates:
  # ───────────────────────────── Rust workspace ────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ──────────────────── npm (native binding toolchain only) ────────────────
  - package-ecosystem: "npm"
    directory: "/bindings/node"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ───────────────────────────── GitHub Actions ────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
