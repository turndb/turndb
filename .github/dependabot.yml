# Dependabot config — https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# THREE ecosystems, not two. TurnDB is a Rust workspace that also ships a
# native Node addon, so it carries cargo and npm manifests plus workflow
# actions. A config covering only one reads as covered.
#
#   cargo           — root workspace Cargo.toml/Cargo.lock, which resolves
#                     for the engine and both binding crates
#   npm             — bindings/node ONLY. The other two package.json files
#                     (npm/turndb, bindings/node/npm/linux-x64-gnu) declare
#                     no dependencies of any kind, so there is nothing there
#                     to update. Add them if that changes.
#   github-actions  — .github/workflows/
#
# NO `labels:` KEY, DELIBERATELY. An earlier draft carried `dependencies`
# and `ci`, inherited from CommandSuite where both exist. Neither exists
# here — this repository's labels are bug, ci-red, documentation,
# duplicate, enhancement, good first issue, help wanted, invalid,
# question, wontfix. Dependabot cannot apply a label that does not exist
# and the routing is lost silently, exactly as GitHub silently ignores a
# CODEOWNERS entry naming a non-collaborator.
#
# Before adding a `labels:` key, confirm each label exists:
#   gh api repos/turndb/turndb/labels --jq '.[].name'
#
# Grouping: minor + patch batch into one PR per ecosystem per week;
# majors open their own PR because a breaking change deserves review on
# its own.

version: 2
updates:
  # ───────────────────────────── Rust workspace ────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ──────────────────── npm (native binding toolchain only) ────────────────
  - package-ecosystem: "npm"
    directory: "/bindings/node"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ───────────────────────────── GitHub Actions ────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
