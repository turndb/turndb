# Dependabot config — https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# THREE ecosystems, not two. TurnDB is a Rust workspace that also ships a
# native Node addon, so it carries cargo and npm manifests plus workflow
# actions. A config covering only one reads as covered.
#
#   cargo           — root workspace Cargo.toml/Cargo.lock, which resolves
#                     for the engine and both binding crates
#   npm             — bindings/node ONLY, because it is the only npm
#                     manifest with dependencies to update. That is a fact
#                     about the tree, not a permanent one — confirm it
#                     before assuming this scoping is still right:
#
#                       git ls-files '*package.json' | while read f; do
#                         printf '%s ' "$f"
#                         python3 -c "import json,sys;d=json.load(open('$f'));\
#                           print([k for k in ('dependencies','devDependencies',\
#                           'optionalDependencies','peerDependencies') if d.get(k)] or 'none')"
#                       done
#   github-actions  — .github/workflows/
#
# NO `labels:` KEY. Dependabot cannot apply a label that does not exist:
# it drops the label silently and reports nothing, exactly as GitHub
# silently ignores a CODEOWNERS entry naming a non-collaborator. So a
# `labels:` key is only correct if every label in it exists.
#
# Before adding one, confirm each label against the repository rather
# than against this comment:
#   gh api repos/turndb/turndb/labels --jq '.[].name'
#
# Grouping: minor + patch batch into one PR per ecosystem per week;
# majors open their own PR because a breaking change deserves review on
# its own.

version: 2
updates:
  # ───────────────────────────── Rust workspace ────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ──────────────────── npm (native binding toolchain only) ────────────────
  - package-ecosystem: "npm"
    directory: "/bindings/node"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ───────────────────────────── GitHub Actions ────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
