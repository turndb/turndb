[package]
versioned_files = [
  "Cargo.toml",
  "Cargo.lock",
  "bindings/node/Cargo.toml",
  "bindings/wasm/Cargo.toml",
  "bindings/python/Cargo.toml",
  "bindings/node/package.json",
  "bindings/node/npm/linux-x64-gnu/package.json",
  "npm/turndb/package.json",
  "cli/package.json",
  "cli/npm/linux-x64-gnu/package.json",
]
changelog = "CHANGELOG.md"

[github]
owner = "turndb"
repo = "turndb"

[changes]
# Release intent lives in reviewed change files. Conventional-looking commit subjects must not
# silently enlarge or reclassify the version prepared by those files.
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "python3 scripts/sync-release-version.py $version"

[[workflows.steps]]
type = "Command"
command = "python3 scripts/check-release-metadata.py"

[[workflows.steps]]
type = "Command"
command = "git add --all"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "This PR was created by Knope. Review the generated CHANGELOG.md entry and all lockstep version changes. Merging it creates the v$version release after the protected publication jobs are approved.\n\nAfter the native publication succeeds, restore the platform package's resolved lock entry on main: `npm install --package-lock-only --ignore-scripts` in `bindings/node`, committed via PR. The release branch intentionally carries a version-less stub for it, which npm accepts only while the pinned version is unpublished."

# There is deliberately no `release` workflow here. Knope's Release step treats an existing tag at
# the prepared version as evidence the release is already done, and this repository creates the
# annotated tag before releasing so the publication workflows have an annotated object to verify.
# The two cannot both be satisfied, so tagging and the GitHub release are driven directly by
# `.github/workflows/release.yml`. Re-adding a Release step here would restore a silent no-op.
