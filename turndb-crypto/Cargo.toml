[package]
name = "turndb-crypto"
version = "0.0.0"
edition = "2021"

# The cipher implementation, kept OUT of the core so the substrate's dependency surface stays what
# it claims to be. chacha20poly1305 over aes-gcm/ring: pure Rust (no C toolchain, so wasm and
# cross builds stay trivial), constant-time by construction on every target rather than only where
# AES-NI exists, and RustCrypto's audited implementation.

[dependencies]
turndb = { path = ".." }
chacha20poly1305 = "0.10"
anyhow = "1"
blake3 = "1"
