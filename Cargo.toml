[workspace]
# The crate stays the root package and stays PURE — no network, no runtime, no daemon. Anything
# that listens on a socket lives in a member crate, where its dependency tree cannot leak into
# the substrate.
members = ["turnd", "turndb-crypto"]

[package]
name = "turndb"
version = "0.0.0"
edition = "2021"

[features]
# SQL is a LENS, not the substrate. A storage engine should not force a query engine on every
# embedder, so the whole plane is optional — but it is on by default, because a feature that is not
# built by default is a feature that is not tested.
default = ["sql"]
sql = ["dep:datafusion", "dep:async-trait", "dep:futures", "dep:tokio"]
# Deterministic-simulation testing: arms a recorder inside the write-path seam (src/vfs.rs) so the
# DST harness can reconstruct every crash state. Off by default and adds nothing when off; the
# harness runs as `cargo test --features dst --test dst`.
dst = []

[dependencies]
# The query lens. Arrow comes in THROUGH datafusion's re-export rather than as its own dependency,
# so an arrow version mismatch between the two is structurally impossible.
datafusion = { version = "54", optional = true }
# TableProvider is an async trait; this is datafusion's own requirement, not an extra choice.
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
# The runtime datafusion requires to drive a query — already in the tree through datafusion
# itself; declaring it lets the CLI block_on a SQL statement. Adds nothing new to the build.
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
# Content identity. The fold's whole addressing scheme rests on this.
blake3 = "1"
anyhow = "1"
# Frame/WAL integrity. BLAKE3 identifies CONTENT; crc32 detects a TORN WRITE cheaply on structures
# that have no content hash of their own (segment tails, WAL frames, part footers).
crc32fast = "1"
# The manifest only. Everything on the hot path has an explicit byte layout — deliberately NOT serde,
# so no dependency's encoding choices can silently become our on-disk format.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = "0.13"
# flock: the single-writer invariant, enforced by the OS rather than by convention.
libc = "0.2"

[profile.release]
debug = true

[dev-dependencies]
# DataFusion is async; the SQL tests need a runtime to drive it.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The query demo exercises the lens, so it only exists when the lens does.
[[example]]
name = "query_demo"
required-features = ["sql"]
